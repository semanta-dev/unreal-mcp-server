name: ci

on:
  push:
    branches: ['**'] # all branches, not tags (a tag push runs this via release.yml)
  pull_request:
  workflow_dispatch:
  workflow_call: # the release workflow runs this exact suite before it builds anything

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local

jobs:
  lint-test:
    name: lint + race test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: gofmt gate
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then echo "unformatted:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: stdout-purity gate
        # stdout carries the MCP JSON-RPC frame. All serving-time code lives in
        # internal/ and must never write stdout (logs go to stderr). The only
        # sanctioned stdout writes are the pre-serve CLI handlers in main.go
        # (-version / -selftest), which print then exit before srv.Run.
        run: |
          if grep -RnE 'fmt\.Print(ln|f)?\(|os\.Stdout' --include='*.go' internal | grep -v '_test.go'; then
            echo "stdout write found in serving path (must go to stderr)"; exit 1
          fi
      - name: generated docs are current
        run: |
          go generate ./internal/tools
          git diff --exit-code -- docs/tools.md docs/migration-v2.md
      - name: race test
        run: go test -race ./...
      - name: coverage gates (merged; repo 75, tools 70, app 80, config 90)
        run: bash scripts/coverage.sh
      - name: tool-selection eval tasks are solvable (offline dry run)
        run: go run ./cmd/tooleval -mode dry

  test-windows:
    name: test + build + integration (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # tags drive the version stamp
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: go test (covers the Windows-only desktop and process-enumeration code)
        run: go test ./...
      - name: loopback multicast integration test
        run: go test -tags integration -run TestLoopbackMulticastRoundTrip ./internal/uexec/
      - name: build static exe
        env:
          CGO_ENABLED: '0'
        shell: bash
        run: |
          VER=$(git describe --tags --always)
          COMMIT=$(git rev-parse --short HEAD)
          PKG=github.com/jdziat/unreal-mcp-server/internal/version
          go build -trimpath -ldflags "-s -w -X $PKG.Version=$VER -X $PKG.Commit=$COMMIT" -o dist/unreal-mcp.exe ./cmd/unreal-mcp
      - name: version smoke
        run: .\dist\unreal-mcp.exe -version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unreal-mcp-exe
          path: dist/unreal-mcp.exe

  python-lint:
    name: companion module (python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: py_compile
        run: |
          for f in internal/bridge/py/[0-9]*.py; do python -m py_compile "$f"; done
          cat internal/bridge/py/[0-9]*.py > /tmp/mcp_bridge.py && python -m py_compile /tmp/mcp_bridge.py
      - name: ruff (blocking; the module is linted as Go concatenates it)
        run: |
          pip install ruff pytest
          cat internal/bridge/py/[0-9]*.py > /tmp/mcp2_bridge.py
          ruff check --config pyproject.toml /tmp/mcp2_bridge.py
          ruff check internal/bridge/py/tests
      - name: pytest (companion contract + v1/v2 handover)
        run: python -m pytest internal/bridge/py/tests -q

  package:
    name: release packaging (all targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: package (the same script the release runs)
        run: bash scripts/package.sh
      - name: checksums verify
        run: cd dist/release && sha256sum -c SHA256SUMS
